services:
  postgres:
    image: postgres:16-alpine
    container_name: budgetizerr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: budget_user
      POSTGRES_PASSWORD: budget_secret_password
      POSTGRES_DB: budgetizerr_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget_user -d budgetizerr_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - budgetizerr_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: budgetizerr_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: budget_user
      DB_PASSWORD: budget_secret_password
      DB_NAME: budgetizerr_db
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001').then(() => process.exit(0)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - budgetizerr_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APP_URL: http://backend:3001
    container_name: budgetizerr_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3012:3000"
    networks:
      - budgetizerr_network

volumes:
  postgres_data:

networks:
  budgetizerr_network: